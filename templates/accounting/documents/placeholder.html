{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ page_title }} - {{ block.super }}{% endblock %}

{% block content %}
<section class="page-section">
    <div class="section-header">
        <h1>{{ page_title }}</h1>
    </div>

    <div style="background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 2rem; text-align: center; margin: 2rem 0;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🚧</div>
        <h2 style="color: #92400e; font-size: 1.5rem; margin-bottom: 0.5rem;">{{ message }}</h2>
        <p style="color: #78350f; font-size: 1rem; margin-bottom: 1.5rem;">این قابلیت به زودی اضافه خواهد شد.</p>
        <a href="{{ back_url }}" class="btn btn-primary" style="padding: 0.75rem 2rem; background: #3b82f6; color: white; border: none; border-radius: 4px; text-decoration: none; display: inline-block; font-size: 1rem;">
            {% trans "بازگشت به لیست" %}
        </a>
    </div>
</section>
{% endblock %}
